<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiki &amp; Knixie ♡</title>
  <meta name="description" content="A tiny page showing how old Kiki and Knixie are." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- Rounded, friendly kawaii typeface -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    Two-half split layout. Each .cat-half holds two stacked .cat-photo layers
    (tap anywhere on the half to crossfade to the next photo of that cat —
    app.js fades between the two layers so there's never a gap showing the
    background underneath) and a .cat-info text overlay (drag it around —
    it's clamped within its own half; tap it to reveal/hide the age).
    Populated and made interactive by app.js from the CATS config.
  -->
  <main class="split" id="split">
    <section class="cat-half" data-cat-index="0">
      <div class="cat-photo" role="img"></div>
      <div class="cat-photo" role="img" aria-hidden="true"></div>
      <div class="cat-info">
        <h1 class="cat-name"></h1>
        <p class="cat-age"></p>
      </div>
    </section>
    <div
      class="divider"
      id="divider"
      role="separator"
      aria-label="Resize the split between Kiki and Knixie"
      tabindex="0"
    ></div>
    <section class="cat-half" data-cat-index="1">
      <div class="cat-photo" role="img"></div>
      <div class="cat-photo" role="img" aria-hidden="true"></div>
      <div class="cat-info">
        <h1 class="cat-name"></h1>
        <p class="cat-age"></p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
